/* ---------- tabs per role ---------- */
function tabsFor(role) {
  const R = S.reservations;
  if (role === 'CUSTOMER') {
    const mine = R.filter(r => r.customerId === S.session.id).length + S.cancelled.filter(r => r.customerId === S.session.id).length;
    return [['book', 'Make a reservation'], ['mine', 'My reservations', mine], ['payments', 'Payment status'], ['profile', 'My profile']];
  }
  if (role === 'STAFF') {
    return [
      ['reservations', 'Reservations', R.length], ['customers', 'Customers'],
      ['updates', 'Update requests', R.filter(r => r.status === 'PENDING_UPDATE').length],
      ['checkin', 'Check in', R.filter(r => r.status === 'CONFIRMED').length],
      ['checkout', 'Check out', R.filter(r => r.status === 'CHECKED_IN').length],
      ['payments', 'Record payment', R.filter(r => balance(r) > 0.005).length]
    ];
  }
  return [
    ['reservations', 'Reservations', R.length], ['customers', 'Customers'],
    ['cancels', 'Cancellation requests', R.filter(r => r.status === 'CANCEL_REQUESTED').length],
    ['cancelled', 'Cancelled', S.cancelled.length], ['log', 'Check-in / out log']
  ];
}

function appView() {
  const s = S.session;
  if (s.role === 'CUSTOMER' && S.loaded && !cust(s.id)) {
    return '<main class="wrap work" style="padding-top:40px">' + emptyState('This account no longer exists.', 'Log out and create a new account.') + '</main>';
  }
  const tabs = tabsFor(s.role);
  let sub;
  if (s.role === 'CUSTOMER') {
    const c = cust(s.id);
    sub = c ? 'Customer ID <span class="mono">' + esc(c.id) + '</span> · ' + esc(c.email) : '';
  } else if (s.role === 'STAFF') {
    sub = 'Front desk · approvals, check-in and check-out, payments';
  } else {
    sub = 'Manager · records, cancellations and the check-in / out log';
  }
  const band = '<section class="welcome"><div class="wrap"><div>' +
    '<div class="eyebrow">' + (s.role === 'CUSTOMER' ? 'My bookings' : 'Front desk') + '</div>' +
    '<h1>' + esc(greeting()) + ', ' + esc(s.role === 'CUSTOMER' && cust(s.id) ? cust(s.id).firstName : sessionName()) + '</h1>' +
    '<p>' + sub + '</p></div>' +
    (s.role === 'CUSTOMER' ? '<button class="btn gold" data-action="tab" data-v="book">Book a table</button>' : '') +
  '</div></section>';
  const nav = '<nav class="tabs" role="tablist" aria-label="Menu">' + tabs.map(t =>
    '<button role="tab" data-action="tab" data-v="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + esc(t[1]) +
    (t[2] ? '<span class="count">' + t[2] + '</span>' : '') + '</button>').join('') + '</nav>';
  let content;
  if (!S.loaded) content = '<p class="loading">Loading saved records…</p>';
  else if (s.role === 'CUSTOMER') content = customerTab();
  else if (s.role === 'STAFF') content = staffTab();
  else content = managerTab();
  return band + '<main class="wrap work">' + nav + content + '</main>' + footer();
}

/* ---------- customer ---------- */
function customerTab() {
  const id = S.session.id;
  const mine = S.reservations.filter(r => r.customerId === id).concat(S.cancelled.filter(r => r.customerId === id))
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

  if (S.tab === 'book') {
    if (S.sub && S.sub.kind === 'booked') {
      const r = S.reservations.find(x => x.id === S.sub.id);
      if (r) {
        return '<div class="section"><div class="success">' +
          '<h2>Reservation confirmed</h2>' +
          '<div><span class="label">Your reservation ID</span><div class="big">' + esc(r.id) + '</div></div>' +
          detailsHTML(r) +
          '<div class="actions"><button class="btn primary" data-action="book-another">Book another table</button>' +
          '<button class="btn" data-action="tab" data-v="mine">See my reservations</button></div>' +
        '</div></div>';
      }
    }
    return '<div class="section"><div class="section-head"><h2>Make a reservation</h2></div>' +
      '<div class="panel">' + bookingForm('book', null) + '</div></div>';
  }

  if (S.tab === 'mine') {
    if (S.sub) {
      const r = mine.find(x => x.id === S.sub.id);
      if (!r) { S.sub = null; return customerTab(); }
      if (S.sub.kind === 'update') {
        return '<div class="section"><div class="section-head"><h2>Update reservation <span class="mono">' + esc(r.id) + '</span></h2>' +
          '<button class="btn" data-action="back">Back</button></div>' +
          '<div class="split"><div class="panel"><h3>Current details</h3>' + detailsHTML(r) + '</div>' +
          '<div class="panel"><h3>New details</h3>' + bookingForm('update', r) + '</div></div></div>';
      }
      if (S.sub.kind === 'cancel') {
        const fee = round2(baseAmount(r) * CANCEL_RATE);
        return '<div class="section"><div class="section-head"><h2>Cancel reservation <span class="mono">' + esc(r.id) + '</span></h2>' +
          '<button class="btn" data-action="back">Back</button></div>' +
          '<div class="panel">' + detailsHTML(r) +
          '<div class="form-note">A cancellation fee of <b>' + peso(fee) + '</b> (' + Math.round(CANCEL_RATE * 100) + '% of the table cost) applies once the manager approves.</div>' +
          '<div class="actions"><button class="btn danger solid" data-action="do" data-op="requestCancel" data-id="' + esc(r.id) + '"' + (S.busy ? ' disabled' : '') + '>Request cancellation</button>' +
          '<button class="btn" data-action="back">Keep reservation</button></div></div></div>';
      }
      return '<div class="section"><div class="section-head"><h2>Reservation <span class="mono">' + esc(r.id) + '</span></h2>' +
        '<button class="btn" data-action="back">Back</button></div><div class="panel">' + detailsHTML(r) + customerRowActions(r) + '</div></div>';
    }
    if (!mine.length) {
      return '<div class="section"><h2>My reservations</h2>' + emptyState('You have no reservations yet.', 'Book a table from "Make a reservation".') + '</div>';
    }
    return '<div class="section"><div class="section-head"><h2>My reservations</h2><span class="muted">' + mine.length + ' reservation' + (mine.length > 1 ? 's' : '') + '</span></div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Res. ID</th><th>Date</th><th>Time</th><th class="right">Guests</th><th>Tables</th><th>Status</th><th>Payment</th><th></th></tr></thead><tbody>' +
      mine.map(r => '<tr><td class="mono">' + esc(r.id) + '</td><td>' + esc(shortDate(r.date)) + '</td><td>' + esc(r.time) + '</td><td class="right">' + r.guests + '</td>' +
        '<td>' + r.numTables + ' × ' + esc(TABLES[r.tableType].label) + '</td><td>' + statusPill(r) + '</td><td>' + payPill(r) + '</td>' +
        '<td><div class="actions"><button class="btn small" data-action="sub" data-kind="detail" data-id="' + esc(r.id) + '">Details</button>' +
        (r.status === 'CONFIRMED' ? '<button class="btn small" data-action="sub" data-kind="update" data-id="' + esc(r.id) + '">Update</button>' : '') +
        (r.status === 'CONFIRMED' || r.status === 'PENDING_UPDATE' ? '<button class="btn small danger" data-action="sub" data-kind="cancel" data-id="' + esc(r.id) + '">Cancel</button>' : '') +
        '</div></td></tr>').join('') +
      '</tbody></table></div></div>';
  }

  if (S.tab === 'payments') {
    if (!mine.length) return '<div class="section"><h2>Payment status</h2>' + emptyState('You have no reservations yet.', '') + '</div>';
    const owed = mine.reduce((a, r) => a + balance(r), 0);
    return '<div class="section"><div class="section-head"><h2>Payment status</h2><span>Total balance <b class="num">' + peso(owed) + '</b></span></div>' +
      '<p class="muted">Pay at the restaurant counter. Staff record each payment here.</p>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Res. ID</th><th>Date</th><th>Status</th><th class="right">Total</th><th class="right">Paid</th><th class="right">Balance</th><th>Payment</th></tr></thead><tbody>' +
      mine.map(r => '<tr><td class="mono">' + esc(r.id) + '</td><td>' + esc(shortDate(r.date)) + '</td><td>' + statusPill(r) + '</td>' +
        '<td class="right">' + peso(totalAmount(r)) + '</td><td class="right">' + peso(r.amountPaid) + '</td><td class="right"><b>' + peso(balance(r)) + '</b></td><td>' + payPill(r) + '</td></tr>').join('') +
      '</tbody></table></div></div>';
  }

  const c = cust(id);
  return '<div class="section"><h2>My profile</h2><div class="panel"><dl class="details">' +
    '<dt>Customer ID</dt><dd class="mono">' + esc(c.id) + '</dd>' +
    '<dt>First name</dt><dd>' + esc(c.firstName) + '</dd>' +
    '<dt>Last name</dt><dd>' + esc(c.lastName || '-') + '</dd>' +
    (c.dup > 0 ? '<dt>Saved as</dt><dd>' + esc(fullName(c)) + '</dd>' : '') +
    '<dt>Contact</dt><dd class="mono">' + esc(c.contact) + '</dd>' +
    '<dt>Email</dt><dd>' + esc(c.email) + '</dd>' +
    '</dl></div></div>';
}
function customerRowActions(r) {
  const b = [];
  if (r.status === 'CONFIRMED') b.push('<button class="btn" data-action="sub" data-kind="update" data-id="' + esc(r.id) + '">Update</button>');
  if (r.status === 'CONFIRMED' || r.status === 'PENDING_UPDATE') b.push('<button class="btn danger" data-action="sub" data-kind="cancel" data-id="' + esc(r.id) + '">Cancel</button>');
  return b.length ? '<div class="actions">' + b.join('') + '</div>' : '';
}

/* ---------- staff & manager shared ---------- */
function customersSection() {
  const list = S.customers.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  if (!list.length) return '<div class="section"><h2>Customer records</h2>' + emptyState('No customers registered yet.', '') + '</div>';
  return '<div class="section"><div class="section-head"><h2>Customer records</h2><span class="muted">' + list.length + ' customer' + (list.length > 1 ? 's' : '') + '</span></div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>Customer ID</th><th>First name</th><th>Last name</th><th>Contact</th><th>Email</th><th class="right">Reservations</th></tr></thead><tbody>' +
    list.map(c => {
      const n = S.reservations.filter(r => r.customerId === c.id).length;
      const first = c.lastName ? c.firstName : fullName(c);
      const last = c.lastName ? c.lastName + (c.dup > 0 ? '(' + c.dup + ')' : '') : '-';
      return '<tr><td class="mono">' + esc(c.id) + '</td><td>' + esc(first) + '</td><td>' + esc(last) + '</td><td class="mono">' + esc(c.contact) + '</td><td>' + esc(c.email) + '</td><td class="right">' + n + '</td></tr>';
    }).join('') + '</tbody></table></div></div>';
}

function sortList(list) {
  const byDate = (a, b) => (a.date + a.time).localeCompare(b.date + b.time);
  if (S.sort === 'payment') return list.sort((a, b) => (PAY_ORDER[payStatus(a)] - PAY_ORDER[payStatus(b)]) || byDate(a, b));
  return list.sort(byDate);
}
const FILTERS = [
  ['ALL', 'All reservations'], ['PENDING_UPDATE', 'Pending update'], ['CONFIRMED', 'Confirmed'], ['CHECKED_IN', 'Checked-In'],
  ['CHECKED_OUT', 'Checked-Out'], ['CANCEL_REQUESTED', 'Cancel requested'],
  ['PAY:FULLY_PAID', 'Payment: Fully Paid'], ['PAY:PARTIALLY_PAID', 'Payment: Partially Paid'], ['PAY:UNPAID', 'Payment: Unpaid']
];
function applyFilter(list) {
  let out = list;
  if (S.filter.indexOf('PAY:') === 0) { const p = S.filter.slice(4); out = out.filter(r => payStatus(r) === p); }
  else if (S.filter !== 'ALL') out = out.filter(r => r.status === S.filter);
  const q = S.query.trim().toLowerCase();
  if (q) out = out.filter(r => {
    const c = cust(r.customerId);
    return r.id.toLowerCase().indexOf(q) >= 0 || fullName(c).toLowerCase().indexOf(q) >= 0 || (c && c.email.indexOf(q) >= 0);
  });
  return out;
}
/* Numbered pick list: [1] name, email, ID ... (the staff "search" list) */
function pickTable(list, actionCell) {
  return '<div class="tbl-wrap"><table><thead><tr><th>No.</th><th>Customer name</th><th>Email</th><th>Res. ID</th><th>Date</th><th>Time</th><th class="right">Guests</th><th>Tables</th><th>Status</th><th>Payment</th><th></th></tr></thead><tbody>' +
    list.map((r, i) => {
      const c = cust(r.customerId);
      return '<tr' + (S.confirm && S.confirm.id === r.id ? ' class="hl"' : '') + '><td class="no">[' + (i + 1) + ']</td><td>' + esc(fullName(c)) + '</td><td>' + esc(c ? c.email : '-') + '</td>' +
        '<td class="mono">' + esc(r.id) + '</td><td>' + esc(shortDate(r.date)) + '</td><td>' + esc(r.time) + '</td><td class="right">' + r.guests + '</td>' +
        '<td>' + r.numTables + ' × ' + esc(TABLES[r.tableType].label) + '</td><td>' + statusPill(r) + '</td><td>' + payPill(r) + '</td>' +
        '<td>' + actionCell(r) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
}
function reservationsSection() {
  if (S.sub && S.sub.kind === 'detail') {
    const r = S.reservations.find(x => x.id === S.sub.id) || S.cancelled.find(x => x.id === S.sub.id);
    if (r) return '<div class="section"><div class="section-head"><h2>Reservation <span class="mono">' + esc(r.id) + '</span></h2>' +
      '<button class="btn" data-action="back">Back to list</button></div><div class="panel">' + detailsHTML(r) + '</div></div>';
    S.sub = null;
  }
  const all = S.reservations;
  const head = '<div class="section-head"><h2>All reservations</h2></div>';
  if (!all.length) return '<div class="section">' + head + emptyState('There are no reservations yet.', 'They appear here when customers book.') + '</div>';
  const list = sortList(applyFilter(all.slice()));
  const controls = '<div class="controls">' +
    '<div class="field"><label for="ctl-q">Search</label><input id="ctl-q" data-ctl="query" type="search" placeholder="Name, email or RN-…" value="' + esc(S.query) + '"></div>' +
    '<div class="field"><label for="ctl-sort">Sort by</label><select id="ctl-sort" data-ctl="sort">' +
      '<option value="date"' + (S.sort === 'date' ? ' selected' : '') + '>Date (earliest first)</option>' +
      '<option value="payment"' + (S.sort === 'payment' ? ' selected' : '') + '>Payment status (Paid, Partial, Unpaid)</option></select></div>' +
    '<div class="field"><label for="ctl-filter">Show</label><select id="ctl-filter" data-ctl="filter">' +
      FILTERS.map(f => '<option value="' + f[0] + '"' + (S.filter === f[0] ? ' selected' : '') + '>' + f[1] + '</option>').join('') + '</select></div>' +
    '</div>';
  return '<div class="section">' + head + controls +
    (list.length ? pickTable(list, r => '<button class="btn small" data-action="sub" data-kind="detail" data-id="' + esc(r.id) + '">View</button>')
      : emptyState('No reservations match.', 'Change the search or the "Show" filter.')) +
    '</div>';
}
function confirmCell(r, op, label, question, danger) {
  if (S.confirm && S.confirm.id === r.id && S.confirm.op === op) {
    return '<div class="confirm-row"><span>' + esc(question) + '</span>' +
      '<button class="btn small ' + (danger ? 'danger solid' : 'primary') + '" data-action="do" data-op="' + op + '" data-id="' + esc(r.id) + '"' + (S.busy ? ' disabled' : '') + '>Yes</button>' +
      '<button class="btn small" data-action="confirm-cancel">No</button></div>';
  }
  return '<button class="btn small' + (danger ? ' danger' : '') + '" data-action="confirm" data-op="' + op + '" data-id="' + esc(r.id) + '">' + esc(label) + '</button>';
}

/* ---------- staff ---------- */
function staffTab() {
  const R = S.reservations;
  if (S.tab === 'customers') return customersSection();
  if (S.tab === 'updates') {
    const list = sortList(R.filter(r => r.status === 'PENDING_UPDATE'));
    if (!list.length) return '<div class="section"><h2>Update requests</h2>' + emptyState('There are no update requests waiting for approval.', '') + '</div>';
    return '<div class="section"><h2>Update requests</h2><div class="cards">' + list.map((r, i) => {
      const c = cust(r.customerId);
      return '<article class="card"><div class="card-head"><div><span class="no">[' + (i + 1) + ']</span> <b>' + esc(fullName(c)) + '</b> <span class="muted">' + esc(c ? c.email : '') + '</span><div class="mono">' + esc(r.id) + '</div></div>' + payPill(r) + '</div>' +
        pendingHTML(r) +
        '<div class="actions"><button class="btn primary" data-action="do" data-op="approveUpdate" data-id="' + esc(r.id) + '"' + (S.busy ? ' disabled' : '') + '>Approve</button>' +
        '<button class="btn" data-action="do" data-op="rejectUpdate" data-id="' + esc(r.id) + '"' + (S.busy ? ' disabled' : '') + '>Reject</button>' +
        '<button class="btn link" data-action="sub" data-kind="detail" data-id="' + esc(r.id) + '" data-tab="reservations">Full details</button></div></article>';
    }).join('') + '</div></div>';
  }
  if (S.tab === 'checkin') {
    const list = sortList(R.filter(r => r.status === 'CONFIRMED'));
    return '<div class="section"><h2>Check in customer</h2>' + (list.length
      ? '<p class="muted">Verify the guest, then check them in. Each check-in is added to the check-in / out log.</p>' +
        pickTable(list, r => confirmCell(r, 'checkIn', 'Check in', 'Check in ' + custName(r.customerId) + '?'))
      : emptyState('There are no confirmed reservations waiting for check-in.', '')) + '</div>';
  }
  if (S.tab === 'checkout') {
    const list = sortList(R.filter(r => r.status === 'CHECKED_IN'));
    return '<div class="section"><h2>Check out customer</h2>' + (list.length
      ? '<p class="muted">A guest can be checked out once the balance is fully paid.</p>' +
        pickTable(list, r => balance(r) > 0.005
          ? '<span class="muted">Owes ' + peso(balance(r)) + ' · </span><button class="btn small link" data-action="tab" data-v="payments">Record payment</button>'
          : confirmCell(r, 'checkOut', 'Check out', 'Check out ' + custName(r.customerId) + '?'))
      : emptyState('No customers are checked in right now.', '')) + '</div>';
  }
  if (S.tab === 'payments') {
    const list = sortList(R.filter(r => balance(r) > 0.005));
    if (!list.length) return '<div class="section"><h2>Record payment</h2>' + emptyState('There are no reservations with an unpaid balance.', '') + '</div>';
    return '<div class="section"><h2>Record payment</h2><p class="muted">Enter the amount the customer paid at the counter.</p>' +
      '<div class="tbl-wrap"><table><thead><tr><th>No.</th><th>Customer name</th><th>Email</th><th>Res. ID</th><th>Status</th><th class="right">Total</th><th class="right">Paid</th><th class="right">Balance</th><th>Amount received</th></tr></thead><tbody>' +
      list.map((r, i) => {
        const c = cust(r.customerId); const form = 'pay-' + r.id;
        const err = (S.errors[form] || {}).amount;
        return '<tr><td class="no">[' + (i + 1) + ']</td><td>' + esc(fullName(c)) + '</td><td>' + esc(c ? c.email : '-') + '</td><td class="mono">' + esc(r.id) + '</td><td>' + statusPill(r) + '</td>' +
          '<td class="right">' + peso(totalAmount(r)) + '</td><td class="right">' + peso(r.amountPaid) + '</td><td class="right"><b>' + peso(balance(r)) + '</b></td>' +
          '<td class="wrap-cell"><form class="pay-form" data-form="' + form + '" novalidate><div class="field' + (err ? ' has-err' : '') + '">' +
          '<input id="' + form + '-amount" data-f="' + form + '" data-k="amount" inputmode="decimal" placeholder="e.g. 500" aria-label="Amount received for ' + esc(r.id) + '" value="' + esc(fv(form).amount || '') + '"' + (err ? ' aria-invalid="true"' : '') + '>' +
          (err ? '<p class="err">' + esc(err) + '</p>' : '') + '</div>' +
          '<button class="btn small primary" type="submit"' + (S.busy ? ' disabled' : '') + '>Record</button></form></td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }
  return reservationsSection();
}

/* ---------- manager ---------- */
function managerTab() {
  if (S.tab === 'customers') return customersSection();
  if (S.tab === 'cancels') {
    const list = sortList(S.reservations.filter(r => r.status === 'CANCEL_REQUESTED'));
    if (!list.length) return '<div class="section"><h2>Cancellation requests</h2>' + emptyState('There are no cancellation requests.', '') + '</div>';
    return '<div class="section"><h2>Cancellation requests</h2><p class="muted">Approving moves the reservation to the cancelled records and charges ' + Math.round(CANCEL_RATE * 100) + '% of the table cost. Rejecting makes it Confirmed again.</p>' +
      pickTable(list, r => {
        const fee = round2(baseAmount(r) * CANCEL_RATE);
        if (S.confirm && S.confirm.id === r.id) return confirmCell(r, 'approveCancel', '', 'Approve and charge ' + peso(fee) + '?', true);
        return '<div class="actions"><button class="btn small danger" data-action="confirm" data-op="approveCancel" data-id="' + esc(r.id) + '">Approve</button>' +
          '<button class="btn small" data-action="do" data-op="rejectCancel" data-id="' + esc(r.id) + '"' + (S.busy ? ' disabled' : '') + '>Reject</button></div>';
      }) + '</div>';
  }
  if (S.tab === 'cancelled') {
    const list = sortList(S.cancelled.slice());
    if (!list.length) return '<div class="section"><h2>Cancelled reservations</h2>' + emptyState('No reservations have been cancelled.', '') + '</div>';
    return '<div class="section"><h2>Cancelled reservations</h2><p class="muted">Cancelled reservations are kept here instead of being deleted. The total is the cancellation fee.</p>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Res. ID</th><th>Customer name</th><th>Email</th><th>Date</th><th>Tables</th><th class="right">Fee charged</th><th class="right">Paid</th><th class="right">Balance</th><th class="right">Refund due</th><th>Payment</th></tr></thead><tbody>' +
      list.map(r => {
        const c = cust(r.customerId);
        return '<tr><td class="mono">' + esc(r.id) + '</td><td>' + esc(fullName(c)) + '</td><td>' + esc(c ? c.email : '-') + '</td><td>' + esc(shortDate(r.date)) + '</td><td>' + r.numTables + ' × ' + esc(TABLES[r.tableType].label) + '</td>' +
          '<td class="right">' + peso(totalAmount(r)) + '</td><td class="right">' + peso(r.amountPaid) + '</td><td class="right">' + peso(balance(r)) + '</td><td class="right">' + peso(refundDue(r)) + '</td><td>' + payPill(r) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
  }
  if (S.tab === 'log') {
    const list = S.statuslog.slice().sort((a, b) => b.ts.localeCompare(a.ts) || b.id.localeCompare(a.id));
    if (!list.length) return '<div class="section"><h2>Check-in / out log</h2>' + emptyState('No check-ins or check-outs recorded yet.', '') + '</div>';
    return '<div class="section"><h2>Check-in / out log</h2>' +
      '<div class="tbl-wrap"><table><thead><tr><th>Time stamp</th><th>Res. ID</th><th>Customer ID</th><th>Customer name</th><th>Status</th></tr></thead><tbody>' +
      list.map(e => '<tr><td>' + esc(e.ts) + '</td><td class="mono">' + esc(e.reservationId) + '</td><td class="mono">' + esc(e.customerId) + '</td><td>' + esc(e.customerName) + '</td><td>' +
        pill(e.status === 'Checked-In' ? 'p-ok' : 'p-mute', e.status) + '</td></tr>').join('') +
      '</tbody></table></div></div>';
  }
  return reservationsSection();
}

/* ======================================================================
   Render loop (keeps focus and cursor position across re-renders)
   ====================================================================== */
function render() {
  const app = document.getElementById('app');
  const a = document.activeElement;
  let focusId = null, ss = null, se = null;
  if (a && a.id && app.contains(a)) {
    focusId = a.id;
    try { ss = a.selectionStart; se = a.selectionEnd; } catch (e) { /* not a text input */ }
  }
  app.innerHTML = topBar() + (S.view === 'app' && S.session ? appView() : S.view === 'account' ? accountView() : homeView());
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus({ preventScroll: true });
      try { if (ss != null) el.setSelectionRange(ss, se); } catch (e) { /* ignore */ }
    }
  }
}
let toastTimer = null;
function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.innerHTML = '<div class="t' + (bad ? ' bad' : '') + '">' + esc(msg) + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.innerHTML = ''; }, bad ? 6500 : 4000);
}

/* ======================================================================
   Events
   ====================================================================== */
function goBack() {
  if (S.confirm) { S.confirm = null; render(); return; }
  if (S.sub) { S.sub = null; render(); return; }
}

/* Booking from the home page (booking bar or a table card). Signed-in customers go straight
   to the booking form with the details filled in; everyone else signs in first. */
function startBooking() {
  const s = S.session;
  if (s && s.role !== 'CUSTOMER') { toast('Booking is for customers. Log out of the ' + roleLabel(s.role).toLowerCase() + ' account first.', true); return; }
  if (s) {
    S.view = 'app'; S.tab = 'book'; S.sub = null; S.confirm = null;
    resetForm('book', S.pendingBook || null); S.pendingBook = null; saveSession();
  } else {
    S.view = 'account'; if (S.homeTab === 'staff') S.homeTab = 'login';
  }
  render(); window.scrollTo(0, 0);
}

const SUBMIT = {
  hero() {
    const res = runCheck('hero', true);
    if (!res.ok) return render();
    const v = res.values;
    S.pendingBook = Object.assign({}, S.pendingBook || {}, { date: v.date, time: v.time, guests: String(v.guests) });
    startBooking();
  },
  loginCustomer() {
    const res = runCheck('loginCustomer', true);
    if (!res.ok) return render();
    signIn({ role: 'CUSTOMER', id: res.values.email.id });
    toast('Welcome, ' + fullName(res.values.email) + '!');
    render();
  },
  loginStaff() {
    const res = runCheck('loginStaff', true);
    if (!res.ok) return render();
    const e = res.values.employee;
    signIn({ role: e.role, username: e.username, name: e.name });
    toast('Welcome, ' + e.name + '! Logged in as ' + (e.role === 'STAFF' ? 'Staff' : 'Manager') + '.');
    render();
  },
  register() {
    const res = runCheck('register', true);
    if (!res.ok) return render();
    run(() => Actions.register(res.values), c => {
      const v = res.values;
      return 'Registration successful! Your Customer ID is ' + c.id + '.' + (c.dup > 0 ? ' The name ' + v.first + ' ' + v.last + ' is already registered, so your name was saved as ' + fullName(c) + '.' : '');
    }).then(c => {
      resetForm('register');
      signIn({ role: 'CUSTOMER', id: c.id });
      render();
    }).catch(() => {});
  },
  book() {
    const res = runCheck('book', true);
    if (!res.ok) return render();
    run(() => Actions.makeReservation(res.values), r => 'Reservation confirmed! Your Reservation ID is ' + r.id + '.')
      .then(r => { resetForm('book'); S.sub = { kind: 'booked', id: r.id }; render(); }).catch(() => {});
  },
  update() {
    const res = runCheck('update', true);
    if (!res.ok) return render();
    const r = S.reservations.find(x => x.id === S.sub.id);
    if (!r) return;
    const v = res.values;
    const ch = { date: v.date, time: v.time, guests: v.guests, tableType: v.type, numTables: v.tables };
    if (sameAs(r, ch)) { S.formMsg.update = 'Nothing was changed. Edit at least one detail, or go back.'; return render(); }
    S.formMsg.update = '';
    run(() => Actions.requestUpdate(r.id, ch), 'Update request sent. It shows as Pending Update until staff approve it.')
      .then(() => { S.sub = null; render(); }).catch(() => {});
  }
};

document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const name = form.getAttribute('data-form');
  if (name.indexOf('pay-') === 0) {
    const res = runCheck(name, true);
    if (!res.ok) return render();
    const id = name.slice(4);
    run(() => Actions.recordPayment(id, res.values.amount), r => 'Payment recorded. New balance: ' + peso(balance(r)) + ' (' + PAY[payStatus(r)] + ').')
      .then(() => { resetForm(name); render(); }).catch(() => {});
    return;
  }
  if (SUBMIT[name]) SUBMIT[name]();
});

/* Update one field's error message in place, without redrawing the page
   (redrawing while focus moves between fields would drop the cursor). */
function patchField(form, key) {
  const input = document.getElementById(form + '-' + key);
  if (!input || input.type === 'radio') return;
  const wrap = input.closest('.field');
  if (!wrap) return;
  const err = (S.errors[form] || {})[key];
  const hint = wrap.querySelector('.hint');
  let p = wrap.querySelector('.err');
  wrap.classList.toggle('has-err', !!err);
  if (err) {
    if (!p) { p = document.createElement('p'); p.className = 'err'; p.id = input.id + '-err'; wrap.appendChild(p); }
    p.textContent = err;
    input.setAttribute('aria-invalid', 'true');
    input.setAttribute('aria-describedby', p.id);
    if (hint) hint.hidden = true;
  } else {
    if (p) p.remove();
    input.removeAttribute('aria-invalid');
    input.removeAttribute('aria-describedby');
    if (hint) hint.hidden = false;
  }
}
function patchForm(form) {
  (FIELD_ORDER[form] || ['amount']).forEach(k => patchField(form, k));
}

document.addEventListener('input', e => {
  const el = e.target;
  const ctl = el.getAttribute && el.getAttribute('data-ctl');
  if (ctl === 'query') { S.query = el.value; render(); return; }
  const form = el.getAttribute && el.getAttribute('data-f');
  if (!form) return;
  const key = el.getAttribute('data-k');
  fv(form)[key] = el.value;
  if (S.errors[form] && S.errors[form][key]) runCheck(form, false);
  /* the booking forms show live hints (tables needed, cost), so they redraw; focus is kept */
  if (form === 'book' || form === 'update' || el.type === 'radio') render();
  else patchForm(form);
});

document.addEventListener('change', e => {
  const el = e.target;
  const ctl = el.getAttribute && el.getAttribute('data-ctl');
  if (ctl === 'sort' || ctl === 'filter') { S[ctl] = el.value; render(); return; }
  const form = el.getAttribute && el.getAttribute('data-f');
  if (!form || form.indexOf('pay-') === 0) return;
  const key = el.getAttribute('data-k');
  fv(form)[key] = el.value;
  (S.touched[form] || (S.touched[form] = {}))[key] = true;
  runCheck(form, false);
  if (el.type === 'radio') render();
  else patchForm(form);
});

/* Typing \ in a field goes back to the previous field; in the first field it goes back to the list or menu. */
document.addEventListener('keydown', e => {
  if (e.key !== '\\') return;
  const el = e.target;
  if (!(el instanceof HTMLInputElement) || el.type === 'search') return;
  e.preventDefault();
  const form = el.closest('form');
  if (!form) return;
  const stops = [];
  const seenRadio = new Set();
  form.querySelectorAll('input').forEach(x => {
    if (x.disabled || x.type === 'hidden') return;
    if (x.type === 'radio') {
      if (seenRadio.has(x.name)) return;
      seenRadio.add(x.name);
      const checked = form.querySelector('input[type=radio][name="' + x.name + '"]:checked');
      stops.push({ el: checked || x, name: x.name });
      return;
    }
    stops.push({ el: x });
  });
  const idx = stops.findIndex(s => s.el === el || (el.type === 'radio' && s.name === el.name));
  if (idx > 0) { stops[idx - 1].el.focus(); return; }
  if (S.sub || S.confirm) goBack();
  else toast('This is the first field.');
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.getAttribute('data-action');
  const id = el.getAttribute('data-id');
  if (act === 'home-tab') { S.homeTab = el.getAttribute('data-v'); render(); return; }
  if (act === 'go-home') { S.view = 'home'; S.sub = null; S.confirm = null; render(); window.scrollTo(0, 0); return; }
  if (act === 'open-account') { S.view = 'account'; S.homeTab = el.getAttribute('data-v') || 'login'; render(); window.scrollTo(0, 0); return; }
  if (act === 'open-app') { S.view = 'app'; if (!S.tab) S.tab = DEFAULT_TAB[S.session.role]; render(); window.scrollTo(0, 0); return; }
  if (act === 'start-booking') { startBooking(); return; }
  if (act === 'book-type') { S.pendingBook = Object.assign({}, S.pendingBook || {}, { type: el.getAttribute('data-v') }); startBooking(); return; }
  if (act === 'scroll') { const t = document.getElementById(el.getAttribute('data-v')); if (t) t.scrollIntoView({ block: 'start' }); return; }
  if (act === 'logout') { signOut(); render(); return; }
  if (act === 'tab') {
    S.view = 'app'; S.tab = el.getAttribute('data-v'); S.sub = null; S.confirm = null; saveSession();
    if (S.tab === 'book') resetForm('book');
    render(); window.scrollTo(0, 0); return;
  }
  if (act === 'sub') {
    const kind = el.getAttribute('data-kind');
    const t = el.getAttribute('data-tab');
    if (t) S.tab = t;
    S.sub = { kind, id }; S.confirm = null;
    if (kind === 'update') {
      const r = S.reservations.find(x => x.id === id);
      if (r) resetForm('update', { date: r.date, time: r.time, guests: String(r.guests), type: r.tableType, tables: String(r.numTables) });
    }
    render(); window.scrollTo(0, 0); return;
  }
  if (act === 'back') { goBack(); return; }
  if (act === 'book-another') { S.sub = null; resetForm('book'); render(); return; }
  if (act === 'confirm') { S.confirm = { id, op: el.getAttribute('data-op') }; render(); return; }
  if (act === 'confirm-cancel') { S.confirm = null; render(); return; }
  if (act === 'do') {
    const op = el.getAttribute('data-op');
    const msgs = {
      requestCancel: 'Cancellation request sent to the manager for approval.',
      approveUpdate: fee => 'Update approved and saved.' + (fee > 0 ? ' A reschedule fee of ' + peso(fee) + ' was added.' : ''),
      rejectUpdate: 'Update rejected. The original details are kept.',
      checkIn: 'Customer checked in. Added to the check-in / out log.',
      checkOut: 'Customer checked out. Added to the check-in / out log.',
      approveCancel: fee => 'Cancellation approved. Fee charged: ' + peso(fee) + '. Moved to cancelled records.',
      rejectCancel: 'Cancellation rejected. The reservation is Confirmed again.'
    };
    run(() => Actions[op](id), msgs[op]).then(() => { if (op === 'requestCancel') S.sub = null; render(); }).catch(() => {});
  }
});

/* ======================================================================
   Start
   ====================================================================== */
loadSession();
render();
Store.init();
</script>
